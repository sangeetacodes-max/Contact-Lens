name = "customerlens-ai-worker"
main = "src/worker/index.ts"
compatibility_date = "2024-01-01"

[vars]
FIREBASE_PROJECT_ID = "ai-studio-sandhillsdevelop-241f1b4c-90e8-4d40-b602-adcab333b531"

# Optional Cloudflare KV Binding for session caching
# [[kv_namespaces]]
# binding = "KV_SESSIONS"
# id = "your-kv-namespace-id"

# Optional Cloudflare D1 SQL Database Binding
# [[d1_databases]]
# binding = "D1_DATABASE"
# database_name = "customerlens-db"
# database_id = "your-d1-db-id"

# Optional Cloudflare R2 Bucket Binding for file uploads
# [[r2_buckets]]
# binding = "R2_STORAGE"
# bucket_name = "customerlens-storage"
